name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust, portal, QML and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:base-devel
    steps:
      - name: Install build and test tools
        run: >-
          pacman -Syu --noconfirm --needed
          git ca-certificates rust cargo clang lld pkgconf
          qt6-base qt6-declarative qt6-tools kirigami kwindowsystem qqc2-desktop-style
          dbus python appstream desktop-file-utils

      - uses: actions/checkout@v6

      - name: Identify build tool versions for the cache
        id: build-versions
        run: |
          set -euo pipefail
          echo "key=$(pacman -Q rust clang gcc lld qt6-base qt6-declarative | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ steps.build-versions.outputs.key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.build-versions.outputs.key }}-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Run portal tests on a private session bus
        run: dbus-run-session -- cargo test --locked --all-targets -- --ignored

      - name: Run QML tests with the KDE style
        run: >-
          QT_QPA_PLATFORM=offscreen
          QT_QUICK_BACKEND=software
          QT_QUICK_CONTROLS_STYLE=org.kde.desktop
          /usr/lib/qt6/bin/qmltestrunner
          -import tests/qml/mocks -input tests/qml

      # German number formatting uses group separators. Qt reads LANG even
      # without a generated glibc locale.
      - name: Run QML tests with the KDE style in German
        run: >-
          LANG=de_DE.UTF-8
          QT_QPA_PLATFORM=offscreen
          QT_QUICK_BACKEND=software
          QT_QUICK_CONTROLS_STYLE=org.kde.desktop
          /usr/lib/qt6/bin/qmltestrunner
          -import tests/qml/mocks -input tests/qml

      - name: Run Python unit tests
        run: python -m unittest discover -s tests/native -p 'test_*.py'

      - name: Validate desktop and AppStream metadata
        run: |
          desktop-file-validate packaging/io.github.jerry0205.klickmeister.desktop
          appstreamcli validate --no-net packaging/io.github.jerry0205.klickmeister.metainfo.xml

      - name: Build release binary
        run: cargo build --locked --release

      - name: Smoke test the built application
        run: bash tests/qml-smoke.sh target/release/klickmeister

  virtual-wayland:
    name: QML on virtual KWin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base-devel
    steps:
      - name: Install virtual compositor and QML test tools
        # KWin 6.8 removed device-free QPainter compositing. Keep this job's
        # dependency set coherent; see tests/virtual-wayland.md before updating.
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/10/13/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed \
            git ca-certificates python qt6-base qt6-declarative qt6-wayland \
            kirigami qqc2-desktop-style kwin libkscreen dbus mesa libcap
          pacman -Q kwin qt6-base qt6-declarative qt6-wayland libkscreen mesa

      - uses: actions/checkout@v6

      - name: Allow KWin to start without container capabilities
        run: setcap -r /usr/bin/kwin_wayland

      - name: Run QML tests on three virtual monitors
        run: bash tests/qml-wayland.sh
