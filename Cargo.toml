[package]
name = "klickmeister"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
description = "Auto clicker for KDE Plasma on Wayland"
license = "MIT"
repository = "https://github.com/Jerry0205dotde/Auto-Clicker"
build = "build.rs"

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "global_shortcuts"] }
cxx = "1.0.194"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
futures-util = "0.3.31"
reis = { version = "0.7.1", features = ["tokio"] }
rustix = { version = "1.1.4", features = ["time"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["macros", "rt", "sync", "time"] }
toml = "1.1.6"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }

[profile.release]
strip = true

# cxx-qt-lib compiles about 270 C++ binding files in its build script, which
# dominates a cold release build. Its thin wrappers do not need -O3; -O1 cuts
# the cold build by about 6% without slowing the app's own code.
[profile.release.package.cxx-qt-lib]
opt-level = 1

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
